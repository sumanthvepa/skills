# Copy to ci/architecture-review.gitlab-ci.yml and include it from
# .gitlab-ci.yml (see quality-gates/assets/gitlab/gitlab-ci.yml).
#
# Runs the architecture-review skill headlessly on each merge request and
# posts the report as an MR note.
#
# Setup (Settings → CI/CD → Variables, masked and protected as appropriate):
#   ANTHROPIC_API_KEY   API key for the review agent (Claude Code)
#   REVIEW_BOT_TOKEN    project access token with `api` scope, used to post the note
# Advisory by default. Set REVIEW_BLOCKING to "true" to fail the job on
# "VERDICT: CHANGES_REQUESTED" once the team trusts the reviewer.
#
# Other agents: replace the install and `claude -p` lines with your
# agent's headless invocation, keeping tool permissions read-only.

architecture-review:
  stage: review
  image: node:22-bookworm-slim          # ADJUST: current Node LTS
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true"
  variables:
    GIT_DEPTH: "0"
    SKILLS_DIR: .claude/skills          # ADJUST: .agent/skills for Antigravity installs
    REVIEW_BLOCKING: "false"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - npm install -g @anthropic-ai/claude-code          # pin a version when adopting
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      PROMPT="Read ${SKILLS_DIR}/architecture-review/SKILL.md and \
      ${SKILLS_DIR}/architecture-review/references/review-checklist.md, \
      then follow the skill to review the changes between \
      origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} and HEAD in this repository. \
      This is a non-interactive CI run: do not modify any files, and print \
      only the report in the specified format."
      claude -p "$PROMPT" \
        --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)" \
        --output-format text > architecture-review.md
      test -s architecture-review.md
    - |
      curl --fail --silent --show-error --request POST \
        --header "PRIVATE-TOKEN: ${REVIEW_BOT_TOKEN}" \
        --data-urlencode "body@architecture-review.md" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" > /dev/null
    - |
      if [ "$REVIEW_BLOCKING" = "true" ] && grep -q '^VERDICT: CHANGES_REQUESTED' architecture-review.md; then
        echo "Architecture review requested changes."
        exit 1
      fi
  artifacts:
    when: always
    paths: [architecture-review.md]
    expire_in: 30 days
