# Copy to .github/workflows/ci-java.yml
# Make the `build` and `dependency-check` jobs required in branch protection.
# Pin action versions (or SHAs) to current releases when adopting.

name: ci-java

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .            # ADJUST: e.g. backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'            # ADJUST: your Java LTS
          cache: maven                  # or: gradle

      # verify = compile, unit + integration tests (Testcontainers uses the
      # runner's Docker), ArchUnit (QG-03), Spotless check, coverage gates.
      - name: Build and test
        run: ./mvnw -B verify           # or: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/'

  dependency-check:                     # SEC-08
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .            # ADJUST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Requires an NVD API key secret (https://nvd.nist.gov/developers/request-an-api-key).
      # Fails on CVSS >= 7. Cache ~/.m2/repository/org/owasp to speed it up.
      - name: OWASP dependency-check
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
