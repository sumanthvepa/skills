# Copy to .github/workflows/security.yml
# CodeQL and dependency review are free for public repositories; private
# repositories need GitHub Advanced Security (Code Security). Remove those
# jobs if unavailable and rely on the per-stack scanners and GitLab/other SAST.
# Pin action and tool versions to current releases when adopting.

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'                 # weekly scan for newly disclosed issues

permissions:
  contents: read

jobs:
  secrets:                              # SEC-05, CFG-01
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2          # ADJUST: current release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # scan full history, not just the last commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  codeql:                               # SEC-03, SEC-04
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]   # ADJUST
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:                    # SEC-08: blocks PRs adding vulnerable deps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
